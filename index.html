<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cable Counter</title>
    <meta name="description" content="Count rows across several knitting charts at once.">
    <meta name="theme-color" content="#f4efe7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cables">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <noscript>Cable Counter needs JavaScript turned on.</noscript>
    </div>
    <div id="snack" class="snack" role="status" aria-live="polite"></div>
  </body>
</html>
